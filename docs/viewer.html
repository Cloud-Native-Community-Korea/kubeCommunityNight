<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>발표 자료 · CNCK Kube Community Night</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body class="viewer">
  <div class="stage" id="stage">
    <img id="slide" class="slide-img" alt="슬라이드">
    <button class="nav prev" id="prev" aria-label="이전 슬라이드">&#8249;</button>
    <button class="nav next" id="next" aria-label="다음 슬라이드">&#8250;</button>
  </div>

  <div class="topbar" id="topbar">
    <a class="home" href="index.html">&larr; 목록</a>
    <span class="title" id="title">불러오는 중…</span>
    <span class="spacer"></span>
    <span class="counter" id="counter">– / –</span>
    <a class="dl" id="dl" href="#" download>PPTX</a>
    <button class="fs" id="fs" aria-label="전체화면" title="전체화면 (F)">&#9974;</button>
  </div>

  <script>
    const qs = new URLSearchParams(location.search);
    const eid = qs.get('event') || '1';
    const base = `events/${encodeURIComponent(eid)}`;
    const img = document.getElementById('slide');
    const counter = document.getElementById('counter');
    let idx = 0, total = 0;

    const pad = n => String(n).padStart(2, '0');
    const srcFor = i => `${base}/slides/${pad(i + 1)}.png`;

    function show(i) {
      if (total === 0) return;
      idx = Math.max(0, Math.min(total - 1, i));
      img.src = srcFor(idx);
      counter.textContent = `${idx + 1} / ${total}`;
      if (idx + 1 < total) { const p = new Image(); p.src = srcFor(idx + 1); }
      history.replaceState(null, '', `?event=${encodeURIComponent(eid)}#${idx + 1}`);
    }

    fetch(`${base}/meta.json`, { cache: 'no-cache' })
      .then(r => r.json())
      .then(m => {
        total = m.slideCount;
        document.getElementById('title').textContent = `${m.no}회 · ${m.title}`;
        const dl = document.getElementById('dl');
        if (m.pptx) dl.href = `${base}/${m.pptx}`; else dl.style.display = 'none';
        const start = parseInt(location.hash.slice(1), 10) || 1;
        show(start - 1);
      })
      .catch(() => { counter.textContent = '로드 실패'; document.getElementById('title').textContent = '자료를 찾을 수 없습니다'; });

    document.getElementById('prev').onclick = e => { e.stopPropagation(); show(idx - 1); };
    document.getElementById('next').onclick = e => { e.stopPropagation(); show(idx + 1); };
    document.getElementById('fs').onclick = e => {
      e.stopPropagation();
      if (!document.fullscreenElement) document.documentElement.requestFullscreen();
      else document.exitFullscreen();
    };

    document.getElementById('stage').addEventListener('click', e => {
      if (e.target.closest('.nav')) return;
      const r = e.currentTarget.getBoundingClientRect();
      if (e.clientX < r.left + r.width / 2) show(idx - 1); else show(idx + 1);
    });

    document.addEventListener('keydown', e => {
      const k = e.key;
      if (k === 'ArrowRight' || k === 'PageDown' || k === ' ') { show(idx + 1); e.preventDefault(); }
      else if (k === 'ArrowLeft' || k === 'PageUp') { show(idx - 1); e.preventDefault(); }
      else if (k === 'Home') show(0);
      else if (k === 'End') show(total - 1);
      else if (k.toLowerCase() === 'f') document.getElementById('fs').click();
    });

    // auto-hide the top bar while idle
    const topbar = document.getElementById('topbar');
    let t;
    const wake = () => {
      topbar.classList.remove('hide');
      clearTimeout(t);
      t = setTimeout(() => topbar.classList.add('hide'), 2600);
    };
    document.addEventListener('mousemove', wake);
    document.addEventListener('keydown', wake);
    wake();
  </script>
</body>
</html>
